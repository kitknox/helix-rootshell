[package]
name = "helix-ios"
description = "Helix editor iOS static library with C FFI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
helix-term = { path = "../helix-term", default-features = false, features = ["ios", "git"] }
helix-core = { path = "../helix-core" }
helix-view = { path = "../helix-view" }
helix-event = { path = "../helix-event", features = ["integration_test"] }
helix-loader = { path = "../helix-loader" }
helix-stdx = { path = "../helix-stdx" }
tree-house = { workspace = true }
tui = { path = "../helix-tui", package = "helix-tui", default-features = false, features = ["ios"] }
termina = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "time", "macros", "fs", "parking_lot", "sync"] }
tokio-stream = "0.1"
futures = { version = "0.3", default-features = false }
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
arc-swap = "1.8"
serde_json = "1.0"
log = "0.4"
libc = "0.2"
anyhow = "1.0"

# For gix CLI entry point (gix_main)
gitoxide-core = { path = "../../gitoxide/gitoxide-core", default-features = false, features = [
    "blocking-client",
    "serde",
    "clean",
    "archive",
] }
gix = { path = "../../gitoxide/gix", default-features = false, features = [
    # Upstream gix-hash now requires an explicit hash-algorithm feature; gix's
    # `default` set (which carries `sha1`) is off here, so enable it directly.
    "sha1",
    "max-performance-safe",
    "comfort",
    "merge",
    "blob-diff",
    "blame",
    "revision",
    "index",
    "mailmap",
    "excludes",
    "attributes",
    "worktree-mutation",
    "credentials",
    "interrupt",
    "status",
    "dirwalk",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-archive",
    "revparse-regex",
] }
gix-features = { path = "../../gitoxide/gix-features" }
clap = { version = "4.5.42", features = ["derive", "cargo"] }
prodash = { version = "31.0.0", features = ["progress-tree", "progress-tree-log"] }
is-terminal = "0.4.0"

[build-dependencies]
cc = "1"
